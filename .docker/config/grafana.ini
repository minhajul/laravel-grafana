[server]
http_port = 3000

[auth.anonymous]
# Disable auto-login
enabled = false

[auth.basic]
enabled = true

[auth]
# Show the form
disable_login_form = false

# The admin credentials are not stored here: docker-compose.yml passes them in
# as GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD (from GRAFANA_ADMIN_* in .env).
