apiVersion: 1

# Grafana-managed alert rules. Each rule queries Prometheus (A), reduces the
# result to its last value (B) and compares it with a threshold (C).
groups:
  - orgId: 1
    name: Availability
    folder: Laravel Observability
    interval: 30s
    rules:
      - uid: laravel-app-down
        title: Laravel app down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              editorMode: code
              expr: probe_success{job="blackbox"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        # A missing probe series means the app cannot be confirmed up.
        noDataState: Alerting
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Laravel app is down
          description: The blackbox HTTP probe of {{ $labels.instance }} has been failing for more than 1 minute.
          __dashboardUid__: laravel_observability
          __panelId__: '8'
        isPaused: false

      - uid: mysql-down
        title: MySQL down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              editorMode: code
              expr: mysql_up
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        # No mysql_up series means mysqld-exporter itself is not reporting.
        noDataState: Alerting
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MySQL is down
          description: mysqld-exporter has been unable to reach MySQL for more than 1 minute.
          __dashboardUid__: laravel_observability
          __panelId__: '11'
        isPaused: false

  - orgId: 1
    name: HTTP performance
    folder: Laravel Observability
    interval: 1m
    rules:
      - uid: laravel-http-5xx-ratio
        title: High HTTP 5xx error ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              editorMode: code
              expr: |-
                (sum(rate(laravel_http_request_duration_seconds_count{status=~"5.."}[5m])) or vector(0))
                /
                sum(rate(laravel_http_request_duration_seconds_count[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        # No traffic means nothing to alert on.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of HTTP requests are failing with 5xx
          description: '{{ humanizePercentage $values.B.Value }} of HTTP requests returned a 5xx status over the last 5 minutes (threshold: 5%).'
          __dashboardUid__: laravel_observability
          __panelId__: '9'
        isPaused: false

      - uid: laravel-http-p95-latency
        title: High HTTP p95 latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(laravel_http_request_duration_seconds_bucket[5m])))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency is above 1s
          description: 'The 95th percentile HTTP response time is {{ humanizeDuration $values.B.Value }} (threshold: 1s).'
          __dashboardUid__: laravel_observability
          __panelId__: '2'
        isPaused: false
