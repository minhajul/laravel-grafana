services:
    laravel.test:
        build:
            context: ./.docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-80}:8000'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4.13'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_EXPORTER_PASSWORD: '${MYSQL_EXPORTER_PASSWORD:-exporter-password}'
        volumes:
            - './.docker/mysql/create-exporter-user.sh:/docker-entrypoint-initdb.d/20-create-exporter-user.sh'
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
            interval: 10s
            start_period: 30s
            start_interval: 1s
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:8.4.8-alpine'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            start_period: 30s
            start_interval: 1s
            retries: 3
            timeout: 5s

    loki:
        image: grafana/loki:3.7.9
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - loki-data:/loki
            # Make sure you mount this new config file!
            - ./.docker/config/local-config.yaml:/etc/loki/local-config.yaml
        networks:
            - sail

    alloy:
        image: grafana/alloy:v1.21.3
        volumes:
            - ./.docker/config/alloy.alloy:/etc/alloy/config.alloy:ro
            # Mount the Laravel logs directory read-only so Alloy can tail them
            - ./storage/logs:/var/log/laravel:ro
            # Persist read positions so a restart doesn't re-ship every log line
            - alloy-data:/var/lib/alloy/data
        command:
            - 'run'
            - '--storage.path=/var/lib/alloy/data'
            - '/etc/alloy/config.alloy'
        networks:
            - sail
        depends_on:
            - loki

    prometheus:
        image: prom/prometheus:v3.15.1
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./.docker/config/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus-data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
        networks:
            - sail
        depends_on:
            - laravel.test

    grafana:
        image: grafana/grafana:13.3.0
        container_name: grafana
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
        volumes:
            - ./.docker/config/grafana.ini:/etc/grafana/grafana.ini
            - ./.docker/config/provisioning:/etc/grafana/provisioning:ro
            # Use a named volume for data persistence to avoid permission issues
            - grafana-data:/var/lib/grafana
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            - mysql
            - prometheus
            - loki
        networks:
            - sail

    node-exporter:
        image: prom/node-exporter:v1.12.1
        container_name: node-exporter
        volumes:
            - '/proc:/host/proc:ro'
            - '/sys:/host/sys:ro'
            - '/:/rootfs:ro'
        command:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
        networks:
            - sail

    mysql-exporter:
        image: prom/mysqld-exporter:v0.21.0
        container_name: mysql-exporter
        environment:
            - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD:-exporter-password}
        command:
            - '--mysqld.username=exporter'
            - '--mysqld.address=mysql:3306'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    blackbox-exporter:
        image: prom/blackbox-exporter:v0.29.1
        container_name: blackbox-exporter
        volumes:
            - ./.docker/config/blackbox.yaml:/etc/blackbox_exporter/config.yml
        command:
            - '--config.file=/etc/blackbox_exporter/config.yml'
        networks:
            - sail

    tempo:
        image: grafana/tempo:3.1.1
        container_name: tempo
        command: ["-config.file=/etc/tempo.yaml"]
        volumes:
            - ./.docker/config/tempo.yaml:/etc/tempo.yaml
            - tempo-data:/var/tempo
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    loki-data:
    grafana-data:
    prometheus-data:
    tempo-data:
    alloy-data:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
